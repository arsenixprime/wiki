name: Release (Fork)

# Self-contained release pipeline for this fork.
#
# Triggered by pushing a tag like `v2.5.314_jp`, it:
#   1. Stamps that version into package.json (and clears the dev flag)
#   2. Builds the production Docker image and pushes it to this repo's own
#      GitHub Container Registry namespace (ghcr.io/<owner>/wiki)
#   3. Extracts the compiled app into a tarball and publishes a GitHub Release
#
# Needs NO extra secrets — the built-in GITHUB_TOKEN can push to ghcr.io and
# create releases for this repository.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v2.5.314_jp)'
        required: true

jobs:
  release:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set Version Variables
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            REF="${{ github.event.inputs.version }}"
          else
            REF="$GITHUB_REF_NAME"
          fi
          echo "REL_VERSION=$REF" >> $GITHUB_ENV
          echo "REL_VERSION_STRICT=${REF#v}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "Building $REF -> ghcr.io/${GITHUB_REPOSITORY,,}:${REF#v}"
          # -> Git build info, baked into the image (shown in Admin → System Info)
          echo "GIT_BRANCH=$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GIT_COMMIT_DATE=$(git show -s --format=%cI HEAD)" >> $GITHUB_ENV

      - name: Disable DEV Flag + Set Version
        run: |
          sudo apt-get install jq -y
          mv package.json pkg-temp.json
          jq --arg vs "$REL_VERSION_STRICT" -r '. + {dev:false, version:$vs}' pkg-temp.json > package.json
          rm pkg-temp.json
          cat package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          build-args: |
            GIT_BRANCH=${{ env.GIT_BRANCH }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            GIT_COMMIT_DATE=${{ env.GIT_COMMIT_DATE }}
          tags: |
            ${{ env.IMAGE }}:${{ env.REL_VERSION_STRICT }}
            ${{ env.IMAGE }}:latest

      - name: Extract compiled files
        run: |
          mkdir -p _dist
          docker create --name wiki ${IMAGE}:${REL_VERSION_STRICT}
          docker cp wiki:/wiki _dist
          docker rm wiki
          rm -f _dist/wiki/config.yml
          cp ./config.sample.yml _dist/wiki/config.sample.yml
          find _dist/wiki/ -printf "%P\n" | tar -czf wiki-js.tar.gz --no-recursion -C _dist/wiki/ -T -

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ env.REL_VERSION }}
          tag: ${{ env.REL_VERSION }}
          token: ${{ github.token }}
          artifacts: 'wiki-js.tar.gz'
          body: |
            Fork of [Wiki.js](https://github.com/requarks/wiki) **${{ env.REL_VERSION_STRICT }}** that adds **full image clipboard pasting support** — paste screenshots / drag-and-drop image files directly into the Markdown and Visual editors (Windows, macOS, Linux).

            ## Install with Docker

            ```bash
            docker run -d -p 3000:3000 \
              -e DB_TYPE=sqlite -e DB_FILEPATH=/wiki/data/wiki.sqlite \
              -v wiki-data:/wiki/data \
              ghcr.io/${{ github.repository }}:${{ env.REL_VERSION_STRICT }}
            ```

            Then browse to `http://localhost:3000` to complete setup. See the [Wiki.js install docs](https://docs.requarks.io/install) for Postgres/MySQL and reverse-proxy setups.

            ## Bare-metal install

            Download `wiki-js.tar.gz` below, extract it, copy `config.sample.yml` to `config.yml`, fill in your database, then run `node server`.
