<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><%= title %></title></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#333;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;"><%= preheadertext %></div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e3e6ea;">
        <tr><td style="padding:20px 24px;text-align:center;background:#00838f;">
          <img src="<%= logo %>" height="40" alt="<%= siteTitle %>" style="height:40px;width:auto;">
        </td></tr>
        <tr><td style="padding:28px 28px 8px 28px;">
          <h1 style="margin:0 0 12px 0;font-size:22px;color:#1a1a1a;font-weight:600;"><%= title %></h1>
          <p style="margin:0 0 16px 0;font-size:15px;line-height:22px;color:#444;"><%= intro %></p>
        </td></tr>
        <tr><td style="padding:0 28px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9fb;border:1px solid #e3e6ea;border-radius:6px;">
            <tr><td style="padding:14px 16px;font-size:14px;line-height:20px;color:#333;">
              <strong style="color:#1a1a1a;"><%= pageTitle %></strong><br>
              <span style="color:#6b7280;font-size:13px;">/<%= pagePath %></span><br>
              <span style="color:#6b7280;font-size:13px;">Published by <%= changedBy %></span>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:24px 28px 8px 28px;">
          <a href="<%= buttonLink %>" style="display:inline-block;background:#00838f;color:#fff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 22px;border-radius:6px;"><%= buttonText %></a>
        </td></tr>
        <tr><td style="padding:8px 28px 28px 28px;">
          <a href="<%= diffLink %>" style="color:#00838f;font-size:14px;text-decoration:none;">View what changed &rarr;</a>
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #eef0f2;font-size:12px;color:#98a2b3;text-align:center;"><%= copyright %></td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
